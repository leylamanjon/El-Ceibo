<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Propuesta KOINOR × El Ceibo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#FAF7F4;--surf:#fff;--line:#E8DDD4;--ink:#3A2118;--mut:#7A645A;--cobre:#A65E34;--choc:#5A3325;--tint:#F3EAE2;--deep:#2A1710;--sand:#E3B08A}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 "Open Sans",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}h1,h2,h3{font-weight:700;line-height:1.15;letter-spacing:-.02em;color:var(--choc)}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}.sec{padding:96px 0}section.sec{padding:96px 0}.wrap.sec{padding:96px 28px}
h2{font-size:clamp(30px,4.2vw,44px);margin-bottom:28px;display:flex;align-items:baseline;gap:16px}h2 .n{flex:none;align-self:center;width:46px;height:46px;border:2px solid var(--cobre);border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700;color:var(--cobre);letter-spacing:0}
h3{font-size:26px;margin-bottom:12px}h3 em{display:block;font-style:normal;font-weight:600;font-size:17px;color:var(--cobre);letter-spacing:0;margin-top:4px}
h4{font-size:16px;font-weight:700;color:var(--mut);margin:28px 0 14px}
.lead{font-size:19px;max-width:62ch;color:#5b4338;margin-bottom:20px}.intro{font-weight:600;color:var(--choc);margin:36px 0 16px}
.band{background:var(--tint)}.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}.two .txt p+p,.two .lead+.lead{margin-top:18px}.two .lead{margin:0}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:8px max(28px,calc((100vw - 1120px)/2 + 28px));background:rgba(250,247,244,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand img{height:58px;width:auto;display:block}.nav nav{display:flex;gap:2px;margin-left:auto}
.nav nav a{padding:8px 11px;border-radius:8px;color:var(--choc);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
.nav nav a:hover{background:var(--tint)}.nav nav a.on{color:var(--cobre);background:var(--tint)}
.bar{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--cobre)}
.burger{display:none;margin-left:auto;width:44px;height:44px;border:0;background:none;border-radius:10px;cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.burger i{width:22px;height:2px;background:var(--choc);border-radius:2px;transition:transform .25s,opacity .2s}
.nav.open .burger i:nth-child(1){transform:translateY(7px) rotate(45deg)}.nav.open .burger i:nth-child(2){opacity:0}.nav.open .burger i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
a:focus-visible,button:focus-visible{outline:2px solid var(--cobre);outline-offset:2px}
.hero{background:var(--deep);color:#fff;overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center;padding-top:72px;padding-bottom:72px;animation:in .9s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kn{height:42px;width:auto;display:block;margin-bottom:56px}.hero h1{color:#fff;font-size:clamp(34px,5.2vw,58px);margin-bottom:28px}
.who{font-weight:700;font-size:20px;color:var(--sand);letter-spacing:.02em}.sub{font-size:21px;margin-top:10px;color:#F3EAE2;max-width:30ch}
.hero-p{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:440px}.hero-p img{width:100%;object-fit:cover;display:block;border-radius:6px 6px 6px 6px}
.hero-p img{height:100%;min-height:0}.p1{grid-row:1/3;border-radius:120px 6px 6px 6px!important}
.opp{display:block;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:22px 24px;color:var(--ink);text-decoration:none;font-weight:700;font-size:19px;color:var(--choc)}
a.opp{border-left:4px solid var(--cobre);transition:transform .2s,box-shadow .2s}a.opp:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(90,51,37,.12)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.act .opp{font-weight:400;font-size:17px;border-top:4px solid var(--cobre);padding:26px}.act b{display:block;font-size:22px;color:var(--choc);margin-bottom:8px}
.dark{background:var(--choc);color:#fff}.dark h2{color:#fff}.dark h2 .n{color:var(--sand);border-color:var(--sand)}.quote{font-size:clamp(22px,2.9vw,32px);line-height:1.45;max-width:30em;font-weight:600;letter-spacing:-.01em}
.big50{font-size:clamp(88px,17vw,200px);font-weight:800;line-height:.9;letter-spacing:-.05em;color:var(--cobre);margin:0 0 32px}.hl{font-weight:700;color:var(--choc);font-size:22px;margin-bottom:36px}
.five{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative}.five li{padding:0 20px 0 0;font-size:15.5px;line-height:1.6;color:#5b4338;position:relative}
.five b{display:block;font-size:19px;color:var(--choc);margin-bottom:6px}.five li i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--cobre);color:#fff;font-style:normal;font-weight:700;margin-bottom:18px;position:relative;z-index:1}
.five li:not(:last-child)::before{content:"";position:absolute;top:18px;left:38px;right:0;height:2px;background:var(--cobre);opacity:.35}
.tablist{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px}.tablist button{font:inherit;font-weight:700;cursor:pointer;padding:12px 24px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--choc);text-align:left;transition:background .2s,color .2s}
.tablist button small{display:block;font-size:12.5px;font-weight:600;opacity:.75;line-height:1.3}.tablist button[aria-selected=true]{background:var(--choc);border-color:var(--choc);color:#fff}
[role=tabpanel]{animation:fade .3s ease}[role=tabpanel][hidden]{display:none}@keyframes fade{from{opacity:0}to{opacity:1}}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.chip{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.chip b{display:block;color:var(--choc);font-size:16px;line-height:1.4}.chip span{display:block;font-size:15px;color:var(--mut);line-height:1.55;margin-top:6px}
.etapas{display:flex;align-items:stretch;gap:16px}.etapa{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:28px}.etapa small{display:block;color:var(--cobre);font-weight:700;font-size:15px}.etapa b{font-size:24px;color:var(--choc);line-height:1.25}.arrow{align-self:center;font-size:44px;line-height:1;color:var(--cobre)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.person{display:flex;align-items:center;gap:14px;padding:14px 16px;font-weight:600;background:var(--surf);border:1px solid var(--line);border-radius:12px}
.person span{width:44px;height:44px;border-radius:50%;background:var(--tint);color:var(--cobre);display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.price{margin-top:12px;padding:28px 32px;border-radius:12px;background:var(--choc);color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.price span{font-weight:600;letter-spacing:.04em;color:var(--sand)}.price b{font-size:clamp(28px,4vw,38px);font-weight:800}
.rules{list-style:none;padding:0;margin:0 0 40px;display:grid;gap:0;max-width:820px}.rules li{padding:18px 0 18px 28px;border-left:3px solid var(--cobre);border-bottom:1px solid var(--line);margin-left:0;font-size:17.5px}.rules li:last-child{border-bottom:0}
table{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden}th,td{text-align:left;padding:15px 22px;border-bottom:1px solid var(--line)}th{width:38%;color:var(--mut);font-weight:700;font-size:16px}tr:last-child>*{border:0}td a{color:var(--cobre);font-weight:700}
.path{list-style:none;padding:0;margin:0;max-width:640px}.path li{display:flex;gap:18px;align-items:center;padding:12px 0;position:relative}.path li:not(:last-child)::after{content:"";position:absolute;left:19px;top:52px;height:calc(100% - 40px);width:2px;background:var(--line)}
.path i{width:40px;height:40px;border-radius:50%;background:var(--cobre);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;flex:none;position:relative;z-index:1}.path span{font-size:19px;font-weight:700;color:var(--choc)}
footer{background:var(--deep);padding:48px 28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:40px}footer .kn{margin:0;height:36px}footer img[data-logo]{height:96px;width:auto}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#F3EAE2,var(--bg))}.gate form{width:100%;max-width:380px;text-align:center}
.gate img{width:150px}.gate h1{font-size:28px;margin:12px 0 8px}.gate p{color:var(--mut);margin:0 0 20px}
.gate input{width:100%;font:inherit;padding:14px 52px;border:1px solid var(--line);border-radius:99px;text-align:center;background:#fff}.pwrap{position:relative;margin-bottom:12px}#eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--choc);cursor:pointer;display:grid;place-items:center;border-radius:50%}#eye:hover{background:var(--tint)}.gate .btn{border:0;width:100%;font:inherit;font-weight:600;cursor:pointer}.err{color:#a3342a;min-height:24px;margin-top:10px;font-size:15px}
@media(max-width:1180px){.burger{display:flex}.nav nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg);padding:12px 20px 20px;border-bottom:1px solid var(--line);box-shadow:0 18px 30px rgba(42,23,16,.12);max-height:calc(100vh - 70px);overflow:auto}.nav.open nav{display:flex}.nav nav a{font-size:17px;padding:14px 12px}}
@media(max-width:900px){.hero-in,.two,.three{grid-template-columns:1fr}.hero-in{gap:40px;padding-top:48px;padding-bottom:56px}.kn{margin-bottom:36px}.sec,section.sec,.wrap.sec{padding-top:64px;padding-bottom:64px}.five{grid-template-columns:1fr;gap:8px}.five li{padding:0 0 20px 56px}.five li i{position:absolute;left:0;top:0;margin:0}.five li:not(:last-child)::before{top:38px;bottom:0;left:18px;right:auto;width:2px;height:auto}.etapas{flex-direction:column}.arrow{transform:rotate(90deg)}.hero-p{height:380px}}
@media(max-width:560px){body{font-size:16px}.wrap{padding:0 20px}.wrap.sec{padding-left:20px;padding-right:20px}.nav{padding:6px 16px}.brand img{height:50px}.lead{font-size:17.5px}th,td{display:block;width:100%;padding:12px 18px}th{border:0;padding-bottom:0}.tablist button{flex:1 1 100%}h2{gap:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>

const LG=document.querySelector('.gate img').src;
function init(){
 document.querySelectorAll('img[data-logo]').forEach(i=>i.src=LG);
 const t=document.querySelector('[data-tabs]'),bs=[...t.querySelectorAll('[role=tab]')],ps=[...t.querySelectorAll('[role=tabpanel]')];
 const sel=i=>{bs.forEach((b,j)=>{b.setAttribute('aria-selected',j==i);b.tabIndex=j==i?0:-1});ps.forEach((p,j)=>p.hidden=j!=i)};
 bs.forEach((b,i)=>{b.onclick=()=>sel(i);b.onkeydown=e=>{const k={ArrowRight:1,ArrowLeft:-1}[e.key];if(k){const n=(i+k+bs.length)%bs.length;sel(n);bs[n].focus()}}});sel(0);
 document.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',()=>sel(+a.dataset.go)));
 const nav=document.getElementById('nav'),bg=document.getElementById('bg'),links=[...document.querySelectorAll('#menu a')];
 const close=()=>{nav.classList.remove('open');bg.setAttribute('aria-expanded','false');bg.setAttribute('aria-label','Abrir menú')};
 bg.onclick=()=>{const o=nav.classList.toggle('open');bg.setAttribute('aria-expanded',o);bg.setAttribute('aria-label',o?'Cerrar menú':'Abrir menú')};
 links.forEach(a=>a.addEventListener('click',close));addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 const secs=links.map(a=>document.querySelector(a.getAttribute('href')));const bar=document.getElementById('bar');
 const f=()=>{const h=document.documentElement;bar.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';let c=-1;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<=120)c=i});links.forEach((a,i)=>a.classList.toggle('on',i==c))};
 addEventListener('scroll',f,{passive:true});f()}

const eye=document.getElementById('eye'),pwi=document.getElementById('pw');
eye.onclick=()=>{const show=pwi.type==='password';pwi.type=show?'text':'password';document.getElementById('eo').style.display=show?'none':'';document.getElementById('ec').style.display=show?'':'none';eye.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');pwi.focus()};
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K=[],H0=[];{let n=2,c=0;while(c<64){let p=1;for(let d=2;d*d<=n;d++)if(n%d==0)p=0;if(p){K.push(Math.floor((Math.cbrt(n)%1)*4294967296)|0);if(c<8)H0.push(Math.floor((Math.sqrt(n)%1)*4294967296)|0);c++}n++}}
const rr=(x,n)=>(x>>>n)|(x<<(32-n));
function sha(d){const l=d.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);b.set(d);b[l]=128;const v=new DataView(b.buffer);v.setUint32(n-4,(l*8)>>>0);v.setUint32(n-8,Math.floor(l/536870912));let h=H0.slice();const w=new Array(64);
 for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=v.getUint32(o+i*4)|0;for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(c,17)^rr(c,19)^(c>>>10)))|0}
 let [A,B,C,E,F,G,H,I]=h;for(let i=0;i<64;i++){const t1=(I+(rr(F,6)^rr(F,11)^rr(F,25))+((F&G)^(~F&H))+K[i]+w[i])|0,t2=((rr(A,2)^rr(A,13)^rr(A,22))+((A&B)^(A&C)^(B&C)))|0;I=H;H=G;G=F;F=(E+t1)|0;E=C;C=B;B=A;A=(t1+t2)|0}
 h=[h[0]+A|0,h[1]+B|0,h[2]+C|0,h[3]+E|0,h[4]+F|0,h[5]+G|0,h[6]+H|0,h[7]+I|0]}
 const r=new Uint8Array(32),o=new DataView(r.buffer);h.forEach((x,i)=>o.setUint32(i*4,x>>>0));return r}
const cat=(...a)=>{const r=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let o=0;a.forEach(x=>{r.set(x,o);o+=x.length});return r};
function dec(pw,Z){const salt=u8(Z.s),pb=new TextEncoder().encode(pw);let k=sha(cat(salt,pb));for(let i=0;i<30000;i++)k=sha(cat(k,salt));
 const ct=u8(Z.c),out=new Uint8Array(ct.length);for(let i=0;i*32<ct.length;i++){const bl=new Uint8Array(4);new DataView(bl.buffer).setUint32(0,i);const ks=sha(cat(k,bl));for(let j=0;j<32&&i*32+j<ct.length;j++)out[i*32+j]=ct[i*32+j]^ks[j]}
 const t=new TextDecoder().decode(out);return t.startsWith('KOINOR-OK|')?t.slice(10):null}
document.getElementById('gf').onsubmit=e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='Verificando…';
 setTimeout(()=>{try{const t=dec(pwi.value.trim(),D);if(t===null){err.textContent='Contraseña incorrecta. Usa el ojito para revisarla.';return}
 document.getElementById('app').innerHTML=t;document.getElementById('gate').remove();window.scrollTo(0,0);init()}catch(x){err.textContent='Error: '+x.message}},30)};
</script></body></html>
