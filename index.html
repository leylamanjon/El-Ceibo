<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#EFE5DE">
<title>Propuesta KOINOR × El Ceibo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8D%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6F3;   /* crema de leche */
  --sand:#EFE5DE;    /* café con leche claro */
  --card:#FFFFFF;
  --line:#E2D4CA;
  --ink:#2E1C16;     /* café espresso */
  --soft:#6E574C;    /* café medio */
  --maroon:#6B3424;  /* café rojizo, banda del sello */
  --pod:#A8714F;     /* caramelo / mazorca */
  --latte:#E2C3AC;   /* acento claro sobre fondos oscuros */
  --deep:#2A1712;    /* cacao tostado */
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --top:68px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--top) + env(safe-area-inset-top,0px) + 16px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.72 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl{margin:0}
ul,ol{padding:0;list-style:none}
img{max-width:100%;display:block}
a{color:inherit}
strong{font-weight:700}
:focus-visible{outline:2px solid var(--pod);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:12px;top:-60px;background:var(--deep);color:#fff;padding:10px 16px;border-radius:8px;z-index:100;text-decoration:none;font-weight:600}
.skip:focus{top:12px}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px}
.narrow{max-width:760px}

/* ---------- fondos por sección ---------- */
.bg-paper{background:var(--paper)}
.bg-sand{background:var(--sand)}
.bg-maroon{background:var(--maroon);color:#F6E9E1}
.bg-deep{background:var(--deep);color:#EADBD2}
.sec.bg-maroon h2,.sec.bg-deep h2{color:#fff}
.bg-maroon .n,.bg-deep .n{color:var(--latte)}
.bg-deep strong,.bg-maroon strong{color:#fff}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;height:calc(var(--top) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(20px,calc((100vw - 1080px)/2 + 32px)) 0;background:rgba(239,229,222,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand .c{height:48px;width:auto}
.brand .k{height:20px;width:auto}
.brand .x,.foot .x{font-size:18px;color:var(--soft);line-height:1}
.cur{flex:1;min-width:0;text-align:right;font-size:14px;font-weight:600;color:var(--maroon);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx{font:600 14px/1 var(--sans);display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 16px;min-height:42px;cursor:pointer;flex:none;transition:border-color .2s}
.idx:hover{border-color:var(--pod)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--maroon)}

/* ---------- índice (panel) ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(42,23,18,.34);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;z-index:80;background:var(--paper);visibility:hidden;transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .25s,visibility 0s .3s}
.sheet p{font:600 13px/1.3 var(--sans);color:var(--soft);padding:0 12px 8px}
.sheet a{display:flex;gap:14px;padding:11px 12px;border-radius:10px;text-decoration:none;font-size:15.5px;font-weight:500;color:var(--ink);transition:background .15s}
.sheet a:hover{background:var(--sand)}
.sheet a span{color:var(--pod);min-width:1.4em;font-variant-numeric:tabular-nums;font-weight:600}
.sheet a[aria-current=true]{background:var(--sand);color:var(--maroon);font-weight:600}
body.sheet-open .sheet{visibility:visible;transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .25s}
body.sheet-open .sheet-bg{opacity:1;pointer-events:auto}
@media (min-width:761px){
  .sheet{top:calc(var(--top) + env(safe-area-inset-top,0px) + 10px);right:max(20px,calc((100vw - 1080px)/2 + 32px));width:340px;border-radius:16px;padding:16px 10px 10px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(42,23,18,.18);opacity:0;transform:translateY(-8px)}
  body.sheet-open .sheet{opacity:1;transform:none}
  .sheet-bg{background:transparent}
}
@media (max-width:760px){
  .sheet{left:0;right:0;bottom:0;border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:84vh;overflow:auto;transform:translateY(102%)}
  .sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 14px}
  .sheet a{padding:14px 12px;font-size:16.5px}
  body.sheet-open .sheet{transform:none}
  body.sheet-open{overflow:hidden}
}

/* ---------- portada ---------- */
.hero{padding:96px 0 0}
.kicker{font-size:15px;font-weight:600;color:var(--maroon);margin-bottom:20px}
.hero h1{font:400 clamp(46px,7.4vw,96px)/.98 var(--serif);letter-spacing:-.01em;color:var(--deep);max-width:15ch}
.tagline{font:italic 400 clamp(22px,2.6vw,30px)/1.35 var(--serif);color:var(--soft);margin-top:26px;max-width:30ch}
.hero-foot{margin-top:80px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr)}
.hero-foot a{position:relative;display:block;padding:22px 48px 30px 0;text-decoration:none;color:var(--soft)}
.hero-foot a+a{padding-left:24px;border-left:1px solid var(--line)}
.hero-foot small{display:block;font-size:13.5px;font-weight:600}
.hero-foot b{display:block;font:400 28px/1.15 var(--serif);color:var(--deep);margin-top:4px;transition:color .2s}
.hero-foot svg{position:absolute;right:20px;top:26px;color:var(--pod);transition:transform .25s}
.hero-foot a:hover b{color:var(--maroon)}
.hero-foot a:hover svg{transform:translateY(3px)}
@media (prefers-reduced-motion:no-preference){
  .hero .rise{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
  .hero .rise{animation-delay:var(--d,0s)}
}
@keyframes rise{to{opacity:1;transform:none}}

/* ---------- secciones ---------- */
.sec{padding:104px 0}
.sec-head{display:flex;align-items:baseline;gap:18px;margin-bottom:30px}
.sec-head .n{font:400 22px/1 var(--serif);color:var(--pod);flex:none;min-width:1.4em;font-variant-numeric:tabular-nums}
.sec h2{font:400 clamp(36px,4.6vw,54px)/1.05 var(--serif);letter-spacing:-.005em;color:var(--deep)}
.sec p+p{margin-top:18px}
.lead{font:400 clamp(23px,2.5vw,28px)/1.42 var(--serif);color:var(--ink)}
.muted{color:var(--soft)}

/* 1 */
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:36px 0}
.facts div{background:var(--card);padding:20px 22px}
.facts b{display:block;font:400 42px/1 var(--serif);color:var(--maroon);margin-bottom:8px}
.facts span{font-size:14px;line-height:1.45;color:var(--soft);display:block}
.opps-intro{margin-top:36px;font-weight:700}
.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.opp{display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:140px;padding:22px;border-radius:14px;background:var(--sand);border:1px solid transparent;text-decoration:none;color:var(--deep);font:400 26px/1.15 var(--serif);transition:border-color .2s,background .2s}
.opp small{font:600 13.5px/1.3 var(--sans);color:var(--maroon);display:flex;justify-content:space-between;align-items:center}
.opp small svg{transition:transform .25s}
.opp:hover{border-color:var(--pod);background:#F3EAE4}
.opp:hover small svg{transform:translateY(3px)}

/* 2 */
.statement{font:400 clamp(26px,3.1vw,38px)/1.32 var(--serif);color:#fff;padding-left:28px;border-left:2px solid var(--latte)}

/* 3 */
#concepto .label{font-size:14px;font-weight:600;color:var(--latte);margin-bottom:14px}
#concepto .big{font:400 clamp(34px,4.4vw,52px)/1.08 var(--serif);color:#fff;max-width:18ch}
#concepto .intro{margin-top:20px;color:#CDB9AE;max-width:52ch}
.verbs{margin-top:40px;border-top:1px solid rgba(255,255,255,.14)}
.verbs li{display:grid;grid-template-columns:140px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.verbs b{font:italic 400 27px/1.15 var(--serif);color:var(--latte)}
.verbs span{color:#EADBD2}

/* 4 */
.steps{margin-top:40px;display:grid;grid-template-columns:repeat(5,1fr);counter-reset:s}
.steps li{position:relative;padding-right:18px}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--paper);border:1.5px solid var(--maroon);color:var(--maroon);font:600 14px/1 var(--sans);position:relative;z-index:1;margin-bottom:18px}
.steps li:not(:last-child)::after{content:"";position:absolute;top:19px;left:38px;right:0;height:1.5px;background:#D6C3B6}
.steps b{display:block;font:400 26px/1.15 var(--serif);color:var(--deep);margin-bottom:6px}
.steps span{display:block;font-size:14.5px;line-height:1.6;color:var(--soft)}

/* 5 */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:30px;padding:6px;background:var(--sand);border-radius:16px}
.tab{font:inherit;text-align:left;cursor:pointer;border:0;background:transparent;border-radius:11px;padding:14px 16px;color:var(--soft);transition:background .2s,color .2s,box-shadow .2s}
.tab small{display:block;font-size:12.5px;font-weight:600;line-height:1.3;margin-bottom:2px}
.tab b{display:block;font:400 25px/1.15 var(--serif);color:var(--deep)}
.tab em{display:block;font-style:normal;font-size:13px;line-height:1.35;margin-top:2px}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:var(--card);color:var(--maroon);box-shadow:0 1px 2px rgba(42,23,18,.06),0 6px 18px rgba(42,23,18,.07)}
.panel{padding-top:36px}
.panel[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.panel{animation:fade .35s ease}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel .lead{margin-bottom:30px}
.panel h3{font-size:14px;font-weight:600;color:var(--soft);margin-bottom:14px}
.lines{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.line{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.line b{display:block;font-weight:700;font-size:16px;line-height:1.35;color:var(--deep)}
.line span{display:block;font-size:14.5px;line-height:1.55;color:var(--soft);margin-top:5px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tags li{padding:8px 15px;border-radius:999px;background:var(--sand);color:var(--ink);font-size:14.5px;font-weight:500;line-height:1.3}

/* 6 */
.stages{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin:6px 0 30px}
.stage{background:var(--paper);border-radius:14px;padding:26px 24px}
.stage small{display:block;font-size:13px;font-weight:600;color:var(--pod);margin-bottom:8px}
.stage b{font:400 28px/1.15 var(--serif);color:var(--deep)}
.stages .to{align-self:center;color:var(--maroon)}

/* 7 */
.team{display:grid;grid-template-columns:repeat(2,1fr);gap:0 32px;margin-top:30px;border-top:1px solid var(--line)}
.team li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-weight:600}
.team .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--maroon);background:var(--sand)}
.team small{color:var(--soft);font-weight:400;font-size:14px}

/* 8 */
.price{margin-top:36px;border-radius:18px;background:var(--maroon);color:#fff;padding:30px 32px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.price small{font-size:14px;font-weight:600;color:var(--latte)}
.price b{font:400 clamp(44px,6vw,64px)/1 var(--serif)}
.price b i{font-style:normal;font-size:.42em;color:var(--latte);margin-left:6px}

/* 9 */
.notes{border-top:1px solid var(--line)}
.notes li{position:relative;padding:18px 0 18px 30px;border-bottom:1px solid var(--line)}
.notes li::before{content:"";position:absolute;left:4px;top:29px;width:8px;height:8px;border-radius:50%;background:var(--pod)}
.terms{margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.terms div{display:grid;grid-template-columns:44% 1fr;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line)}
.terms div:last-child{border-bottom:0}
.terms dt{color:var(--soft);font-size:15px}
.terms dd{margin:0;font-weight:700}
.terms a{color:var(--maroon);text-underline-offset:3px;display:inline-flex;align-items:center;gap:6px}
.ph{color:var(--pod)}

/* 10 */
.path{counter-reset:p}
.path li{position:relative;display:flex;align-items:center;gap:18px;padding:11px 0;font:400 26px/1.2 var(--serif);color:var(--deep)}
.path li::before{counter-increment:p;content:counter(p);flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--pod);color:var(--maroon);font:600 14px/1 var(--sans);position:relative;z-index:1}
.path li:not(:last-child)::after{content:"";position:absolute;left:18.25px;top:49px;height:calc(100% - 38px);width:1.5px;background:#D6C3B6}
.path li.now::before{background:var(--maroon);border-color:var(--maroon);color:#fff}
.path li.now{color:var(--maroon)}


/* footer */
.foot{background:var(--paper);border-top:1px solid var(--line);padding:48px 0 calc(48px + env(safe-area-inset-bottom,0px))}
.foot-in{text-align:center}
.foot-logos{display:flex;align-items:center;gap:14px}
.foot-logos .c{height:72px;width:auto}
.foot-logos .k{height:26px;width:auto}
.foot-in p{font:italic 400 22px/1.3 var(--serif);color:var(--soft)}

/* ---------- contraseña ---------- */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--sand)}
.gate form{width:100%;max-width:380px;text-align:center}
.gate-logos{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 0 36px}
.gate-logos .c{height:110px;width:auto}
.gate-logos .k{height:36px;width:auto}
.gate-logos .x{font:400 24px/1 var(--sans);color:var(--soft)}
.pwrap{position:relative;margin-bottom:12px}
.gate input{width:100%;font:inherit;font-size:16px;padding:14px 52px;border:1px solid var(--line);border-radius:999px;text-align:center;background:#fff;color:var(--ink)}
.gate input:focus{outline:none;border-color:var(--pod);box-shadow:0 0 0 3px rgba(168,113,79,.18)}
#eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;color:var(--soft);cursor:pointer;display:grid;place-items:center;border-radius:50%}
#eye:hover{background:var(--sand)}
.btn{width:100%;border:0;border-radius:999px;padding:14px 22px;background:var(--deep);color:#fff;font:600 16px/1 var(--sans);cursor:pointer;transition:background .2s}
.btn:hover{background:var(--maroon)}
.err{color:#9A3B26;min-height:24px;margin-top:12px;font-size:14.5px}


/* ---------- animaciones sutiles ---------- */
.gate{position:fixed;inset:0;z-index:200;transition:opacity .5s ease,visibility 0s .5s}
.gate form{transition:transform .5s ease}
.gate.out{opacity:0;visibility:hidden;pointer-events:none}
.gate.out form{transform:scale(.98)}
.tabs{position:relative}
.tab{position:relative;z-index:1}
.tab[aria-selected=true]{background:transparent;box-shadow:none}
.tab-ind{position:absolute;left:0;top:0;border-radius:11px;background:var(--card);box-shadow:0 1px 2px rgba(42,23,18,.06),0 6px 18px rgba(42,23,18,.07);transition:transform .38s cubic-bezier(.2,.7,.2,1),width .38s cubic-bezier(.2,.7,.2,1),height .38s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.tabs:not(.ready) .tab-ind{transition:none}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(107,52,36,.35)}100%{box-shadow:0 0 0 12px rgba(107,52,36,0)}}
@media (prefers-reduced-motion:no-preference){
  body.opening .hero .rise{animation-delay:calc(var(--d,0s) + .35s)}
  .hero .d1{--d:.05s}.hero .d2{--d:.14s}.hero .d3{--d:.26s}.hero .d4{--d:.4s}
  .steps li::after{transform:scaleX(0);transform-origin:0 50%;transition:transform .5s cubic-bezier(.4,0,.2,1)}
  .steps.in li::after{transform:none}
  .steps li:nth-child(2)::after{transition-delay:.18s}.steps li:nth-child(3)::after{transition-delay:.36s}.steps li:nth-child(4)::after{transition-delay:.54s}
  .path li::after{transform:scaleY(0);transform-origin:50% 0;transition:transform .35s ease-out}
  .path.in li::after{transform:none}
  .path li:nth-child(1)::after{transition-delay:.9s}.path li:nth-child(2)::after{transition-delay:1.15s}.path li:nth-child(3)::after{transition-delay:1.4s}
  .path li:nth-child(4)::after{transition-delay:1.65s}.path li:nth-child(5)::after{transition-delay:1.9s}.path li:nth-child(6)::after{transition-delay:2.15s}
  .path.in li.now::before{animation:halo 1.2s ease-out .1s 2}
}
@media (prefers-reduced-motion:no-preference) and (max-width:900px){
  .steps li::after{transform:scaleY(0);transform-origin:50% 0}
  .steps.in li::after{transform:none}
}


/* ---------- botones de sección ---------- */
.pager{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;width:48px;padding:4px;border-radius:999px;background:var(--deep);color:#fff;border:1px solid rgba(226,195,172,.4);box-shadow:0 8px 24px rgba(42,23,18,.22);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .3s ease,transform .3s ease}
.pager.show{opacity:1;transform:none;pointer-events:auto}
.pager button{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .2s,opacity .2s}
.pager button:hover{background:rgba(255,255,255,.12)}
.pager button:disabled{opacity:.3;cursor:default;background:transparent}
.pager .num{display:flex;flex-direction:column;align-items:center;line-height:1;padding:4px 0 6px;font-variant-numeric:tabular-nums}
.pager .num b{font:400 24px/1 var(--serif)}
.pager .num i{font-style:normal;font-size:11px;font-weight:600;color:var(--latte);margin-top:3px}
body.sheet-open .pager{opacity:0;pointer-events:none}
@media print{.pager{display:none!important}}


/* ---------- V3: modelo de desarrollo, frentes, etapas ---------- */
.flow{margin-top:44px;max-width:860px;counter-reset:f}
.flow li{position:relative;display:grid;grid-template-columns:44px 1fr;column-gap:22px;padding-bottom:30px}
.flow li:last-child{padding-bottom:0}
.flow li::before{counter-increment:f;content:counter(f,decimal-leading-zero);grid-row:1/3;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--paper);border:1.5px solid var(--maroon);color:var(--maroon);font:600 13.5px/1 var(--sans);font-variant-numeric:tabular-nums;position:relative;z-index:1}
.flow li:not(:last-child)::after{content:"";position:absolute;left:21.25px;top:44px;bottom:0;width:1.5px;background:#D6C3B6}
.flow b{display:block;font:400 27px/1.15 var(--serif);color:var(--deep);padding-top:6px;margin-bottom:6px}
.flow span{display:block;color:var(--soft);font-size:16px;line-height:1.65;max-width:66ch}
.line p{font-size:15.5px;line-height:1.55;color:var(--ink)}
.stages{align-items:start}
.stage ul{margin-top:16px;border-top:1px solid var(--line)}
.stage li{position:relative;padding:12px 0 12px 22px;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.55;color:var(--ink)}
.stage li:last-child{border-bottom:0;padding-bottom:0}
.stage li::before{content:"";position:absolute;left:2px;top:22px;width:7px;height:7px;border-radius:50%;background:var(--pod)}
.stages .to{align-self:center}
.path li{align-items:flex-start;font-size:22px;line-height:1.3}
.path li::before{margin-top:-4px}
.path li:not(:last-child)::after{top:45px;height:calc(100% - 34px)}
@media (prefers-reduced-motion:no-preference){
  .flow li::after{transform:scaleY(0);transform-origin:50% 0;transition:transform .32s ease-out}
  .flow.in li::after{transform:none}
  .flow li:nth-child(2)::after{transition-delay:.2s}.flow li:nth-child(3)::after{transition-delay:.4s}.flow li:nth-child(4)::after{transition-delay:.6s}
  .flow li:nth-child(5)::after{transition-delay:.8s}.flow li:nth-child(6)::after{transition-delay:1s}.flow li:nth-child(7)::after{transition-delay:1.2s}.flow li:nth-child(8)::after{transition-delay:1.4s}
}
@media (max-width:640px){
  .flow li{grid-template-columns:38px 1fr;column-gap:16px;padding-bottom:26px}
  .flow li::before{width:38px;height:38px;font-size:12.5px}
  .flow li:not(:last-child)::after{left:18.25px;top:38px}
  .flow b{font-size:23px;padding-top:4px}
  .flow span{font-size:15.5px}
  .path li{font-size:19px}
}

.price b.pending{font-size:clamp(26px,3.2vw,34px);line-height:1.15;max-width:22ch}
.price{align-items:center}
/* ---------- responsive ---------- */
@media (max-width:900px){
  .steps{grid-template-columns:1fr}
  .steps li{display:grid;grid-template-columns:38px 1fr;column-gap:18px;padding:0 0 26px}
  .steps li::before{grid-row:1/3;margin:0}
  .steps li:not(:last-child)::after{top:38px;bottom:0;left:18.25px;right:auto;width:1.5px;height:auto}
  .lines{grid-template-columns:1fr}
  .opps{grid-template-columns:1fr}
  .opp{min-height:0;flex-direction:row;align-items:center;gap:16px}
  .opp small{flex:none}
}
@media (max-width:640px){
  :root{--top:60px}
  body{font-size:16.5px}
  .wrap{padding:0 20px}
  .top{gap:10px}
  .brand{gap:8px}.brand .c{height:40px}.brand .k{height:16px}
  .cur{font-size:13px}
  .idx{padding:9px 13px;min-height:40px}
  .hero{padding-top:56px;padding-bottom:64px}
  .hero-foot{display:none}
  .sec{padding:72px 0}
  .sec-head{gap:12px;margin-bottom:24px}
  .facts{grid-template-columns:1fr}
  .facts div{display:flex;align-items:baseline;gap:14px}
  .facts b{margin:0;min-width:2.4em;font-size:36px}
  .opp{font-size:23px}
  .statement{padding-left:18px}
  .verbs li{grid-template-columns:1fr;gap:4px}
  .tabs{grid-template-columns:1fr;gap:4px}
  .tab{padding:12px 14px}
  .tab b{font-size:23px}
  .stages{grid-template-columns:1fr}
  .stages .to{justify-self:center;transform:rotate(90deg)}
  .team{grid-template-columns:1fr}
  .price{padding:24px 22px}
  .terms div{grid-template-columns:1fr;gap:2px;padding:14px 18px}
  .path li{font-size:22px}
}
@media (max-width:380px){.cur{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
@media print{
  .top,.sheet,.sheet-bg,.tabs,.skip{display:none!important}
  .panel[hidden]{display:block!important}
  .sec{padding:48px 0;break-inside:avoid-page}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

function init(){
  /* Pestañas de frentes */
  const tabs=[...document.querySelectorAll('[role=tab]')];
  const tl=document.querySelector('.tabs'),ind=document.createElement('span');ind.className='tab-ind';ind.setAttribute('aria-hidden','true');tl.prepend(ind);
  const place=()=>{const t=tabs.find(x=>x.getAttribute('aria-selected')==='true');ind.style.width=t.offsetWidth+'px';ind.style.height=t.offsetHeight+'px';ind.style.transform='translate('+t.offsetLeft+'px,'+t.offsetTop+'px)'};
  place();requestAnimationFrame(()=>tl.classList.add('ready'));addEventListener('resize',place);
  const select=(t,focus)=>{tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;document.getElementById(x.getAttribute('aria-controls')).hidden=!on});place();if(focus)t.focus()};
  if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.35});document.querySelectorAll('.steps,.path,.flow').forEach(el=>io.observe(el))}else document.querySelectorAll('.steps,.path,.flow').forEach(el=>el.classList.add('in'));
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(t));
    t.addEventListener('keydown',e=>{
      const n=(e.key==='ArrowRight'||e.key==='ArrowDown')?1:(e.key==='ArrowLeft'||e.key==='ArrowUp')?-1:0;
      if(e.key==='Home'){e.preventDefault();select(tabs[0],true)}
      else if(e.key==='End'){e.preventDefault();select(tabs[tabs.length-1],true)}
      else if(n){e.preventDefault();select(tabs[(i+n+tabs.length)%tabs.length],true)}
    });
  });
  document.querySelectorAll('[data-goto]').forEach(a=>a.addEventListener('click',()=>select(document.getElementById('t-'+a.dataset.goto))));

  /* Índice */
  const links=[...document.querySelectorAll('#toc a')],btn=document.getElementById('openToc'),bg=document.getElementById('sheetBg');
  const openS=()=>{document.body.classList.add('sheet-open');btn.setAttribute('aria-expanded','true');const c=document.querySelector('#toc [aria-current=true]')||links[0];setTimeout(()=>c.focus({preventScroll:true}),60)};
  const closeS=()=>{document.body.classList.remove('sheet-open');btn.setAttribute('aria-expanded','false')};
  btn.addEventListener('click',()=>document.body.classList.contains('sheet-open')?closeS():openS());
  bg.addEventListener('click',closeS);
  links.forEach(a=>a.addEventListener('click',closeS));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('sheet-open')){closeS();btn.focus()}});

  /* Sección activa + progreso */
  const secs=links.map(a=>document.querySelector(a.getAttribute('href')));
  const cur=document.getElementById('cur'),bar=document.getElementById('progress');let last=-2,tick=false;
  const pager=document.getElementById('pager'),secNum=document.getElementById('secNum'),prevB=document.getElementById('prevSec'),nextB=document.getElementById('nextSec');
  const smooth=!matchMedia('(prefers-reduced-motion: reduce)').matches;
  const go=el=>el.scrollIntoView({behavior:smooth?'smooth':'auto',block:'start'});
  prevB.addEventListener('click',()=>last<=0?scrollTo({top:0,behavior:smooth?'smooth':'auto'}):go(secs[last-1]));
  nextB.addEventListener('click',()=>{if(last<secs.length-1)go(secs[last+1])});
  const update=()=>{
    tick=false;const h=document.documentElement,max=h.scrollHeight-h.clientHeight;
    bar.style.transform='scaleX('+(max>0?Math.min(1,h.scrollTop/max):0)+')';
    let c=-1;const y=innerHeight*.35;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<=y)c=i});
    if(c!==last){last=c;links.forEach((a,i)=>a.setAttribute('aria-current',i===c?'true':'false'));cur.textContent=c<0?'':(c+1)+'. '+a2t(links[c]);
      pager.classList.toggle('show',c>=0);if(c>=0){secNum.querySelector('b').textContent=c+1;secNum.setAttribute('aria-label','Sección '+(c+1)+' de 10')}
      nextB.disabled=c>=secs.length-1;}
  };
  const a2t=a=>a.textContent.replace(/^\d+/,'');
  addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(update)}},{passive:true});
  addEventListener('resize',update);update();
}

const eye=document.getElementById('eye'),pwi=document.getElementById('pw');
eye.onclick=()=>{const show=pwi.type==='password';pwi.type=show?'text':'password';document.getElementById('eo').style.display=show?'none':'';document.getElementById('ec').style.display=show?'':'none';eye.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');pwi.focus()};
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K=[],H0=[];{let n=2,c=0;while(c<64){let p=1;for(let d=2;d*d<=n;d++)if(n%d==0)p=0;if(p){K.push(Math.floor((Math.cbrt(n)%1)*4294967296)|0);if(c<8)H0.push(Math.floor((Math.sqrt(n)%1)*4294967296)|0);c++}n++}}
const rr=(x,n)=>(x>>>n)|(x<<(32-n));
function sha(d){const l=d.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);b.set(d);b[l]=128;const v=new DataView(b.buffer);v.setUint32(n-4,(l*8)>>>0);v.setUint32(n-8,Math.floor(l/536870912));let h=H0.slice();const w=new Array(64);
 for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=v.getUint32(o+i*4)|0;for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(c,17)^rr(c,19)^(c>>>10)))|0}
 let [A,B,C,E,F,G,H,I]=h;for(let i=0;i<64;i++){const t1=(I+(rr(F,6)^rr(F,11)^rr(F,25))+((F&G)^(~F&H))+K[i]+w[i])|0,t2=((rr(A,2)^rr(A,13)^rr(A,22))+((A&B)^(A&C)^(B&C)))|0;I=H;H=G;G=F;F=(E+t1)|0;E=C;C=B;B=A;A=(t1+t2)|0}
 h=[h[0]+A|0,h[1]+B|0,h[2]+C|0,h[3]+E|0,h[4]+F|0,h[5]+G|0,h[6]+H|0,h[7]+I|0]}
 const r=new Uint8Array(32),o=new DataView(r.buffer);h.forEach((x,i)=>o.setUint32(i*4,x>>>0));return r}
const cat=(...a)=>{const r=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let o=0;a.forEach(x=>{r.set(x,o);o+=x.length});return r};
function dec(pw,Z){const salt=u8(Z.s),pb=new TextEncoder().encode(pw);let k=sha(cat(salt,pb));for(let i=0;i<30000;i++)k=sha(cat(k,salt));
 const ct=u8(Z.c),out=new Uint8Array(ct.length);for(let i=0;i*32<ct.length;i++){const bl=new Uint8Array(4);new DataView(bl.buffer).setUint32(0,i);const ks=sha(cat(k,bl));for(let j=0;j<32&&i*32+j<ct.length;j++)out[i*32+j]=ct[i*32+j]^ks[j]}
 const t=new TextDecoder().decode(out);return t.startsWith('KOINOR-OK|')?t.slice(10):null}
document.getElementById('gf').onsubmit=e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='Verificando…';
 setTimeout(()=>{try{const t=dec(pwi.value.trim(),D);if(t===null){err.textContent='Contraseña incorrecta. Usa el ojito para revisarla.';return}
  const g=document.getElementById('gate');document.body.classList.add('opening');document.getElementById('app').innerHTML=t;window.scrollTo(0,0);init();pwi.blur();g.classList.add('out');setTimeout(()=>g.remove(),600)}catch(x){err.textContent='Error: '+x.message}},30)};
</script>
